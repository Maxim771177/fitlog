<!doctype html>

<head>

<title>FitLog Duo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--ln:#e4e7ec;--max:#d92d20;--shirin:#12a150;--ok:#d1fadf}

header{position:sticky;top:0;background:var(--bg);padding:8px;border-bottom:1px solid var(--ln);z-index:5}
.pos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;margin-bottom:6px}
.pos select{width:100%;padding:5px 1px;font-size:12px;border-radius:7px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.wn{font-weight:500;font-size:12px;opacity:.95;margin-top:2px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 11px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
main{padding:8px;max-width:760px;margin:auto}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}
.colh{font-weight:700;text-align:center;padding:6px;border-radius:10px;color:#fff;margin-bottom:6px}
.max .colh{background:var(--max)}.shirin .colh{background:var(--shirin)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:7px;margin-bottom:6px}
.max .card{border-left:3px solid var(--max)}.shirin .card{border-left:3px solid var(--shirin)}
.nm{font-weight:600;font-size:13px;line-height:1.2}
.sc{font-size:12px;color:var(--mut);margin:2px 0}
.st{font-size:12px;display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.st b{font-weight:700}
.set{display:grid;grid-template-columns:14px 1fr 1fr 30px;gap:3px;align-items:center;margin-top:3px}
button.ok{width:30px;height:30px;padding:0;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--mut);font-size:16px;cursor:pointer}
button.ok:disabled{opacity:.35;cursor:default}
button.ok.dirty{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.ok.sv{background:#12a150;color:#fff;border-color:#12a150}
button.ok.q{background:#f79009;color:#fff;border-color:#f79009}
button.ok.del{background:#d92d20;color:#fff;border-color:#d92d20}
button.fin{width:100%;padding:11px;margin:4px 0 14px;border-radius:10px;border:0;background:var(--tx);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
button.fin2{width:100%;padding:8px;margin:2px 0 14px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.finok{text-align:center;padding:9px;margin-top:4px;border-radius:10px;background:var(--ok);font-weight:700}
.set span{font-size:11px;color:var(--mut)}
input{width:100%;min-width:0;padding:5px 2px;text-align:center;border:1px solid var(--ln);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
input.done{background:var(--ok)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
#status{font-size:11px;color:var(--mut);margin-top:3px}
.tabs{display:flex;gap:6px;margin-top:6px;align-items:center}
.mut{color:var(--mut);font-size:13px}
svg{width:100%;height:120px}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
select{width:100%;padding:9px;border-radius:9px;font:inherit}
</style>
</head>

// "3x10-12" -> {sets:3, reps:"10-12"}
const parseScheme = s => { const m = /^(\d+)\s*[x×х]\s*(.+)$/i.exec(String(s||"").trim()); return m ? {sets:+m[1], reps:m[2]} : {sets:3, reps:"10"}; };

/* Тренировок выполнено ДО учёта в приложении (у каждого своё число):
 * 2 полных круга × 32 тренировки (8 недель × 4 дня) + 19 в третьем круге (недели 1–4 и три дня 5-й недели) = 83 */
const BASE = { Max: 83, Shirin: 83 };

/* ============ СОСТОЯНИЕ ============ */
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const st = {
  // у каждого своя позиция: круг / неделя / день (тренируемся независимо)
  pos: LS.get("pos", { Max:{cycle:3,week:5,day:4}, Shirin:{cycle:3,week:5,day:4} }),
  view: "train", puser: LS.get("puser","Max"),
  api: LS.get("api", DEFAULT_API_URL),
  seen: LS.get("seenFin", {}),         // последняя завершённая тренировка, по которой уже сдвинули позицию
  logs: LS.get("logs_cache", []),      // кэш; источник истины — Google Sheets
  queue: LS.get("queue", []),          // ещё не отправленные изменения
  program: null
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const setStatus = t => $("#status").textContent = t;
const USERS = ["Max","Shirin"];

/* ============ API (Google Sheets через Apps Script) ============ */
async function post(body){
  const r = await (await fetch(st.api, {method:"POST", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(body)})).json();
  if(!r.ok) throw new Error(r.error); return r;
}
async function pull(){
  if(!st.api){ setStatus("нет API (⚙)"); return; }
  try{
    setStatus("загрузка…");
    const r = await (await fetch(st.api + "?action=getAll")).json();
    if(!r.ok) throw new Error(r.error);
    const pend = new Set(st.queue.filter(q=>q.op==="save").map(q=>q.row.id));
    const del = new Set(st.queue.filter(q=>q.op==="del").map(q=>q.id));
    st.logs = r.logs.filter(l => !pend.has(l.id) && !del.has(l.id)).concat(st.queue.filter(q=>q.op==="save").map(q=>q.row));
    LS.set("logs_cache", st.logs);
    if(r.program && r.program.length) st.program = buildProgram(r.program);
    followFinished();
    setStatus("✓ синхронизировано");
    const typing = document.activeElement && document.activeElement.tagName==="INPUT";
    if(!typing) render();            // не перерисовываем под руками, пока вводите вес
  }catch(e){ setStatus("офлайн, кэш"); }
}
let flushing = false;
async function flush(){
  if(!st.api || !st.queue.length || flushing) return;
  flushing = true;
  try{
    while(st.queue.length){
      const q = st.queue[0];
      if(q.op==="save") await post({action:"saveSets", rows:[q.row]});
      else await post({action:"deleteSet", id:q.id});
      st.queue.shift(); LS.set("queue", st.queue);
    }
    setStatus("✓ сохранено в таблицу");
  }catch(e){ setStatus(`нет связи, в очереди: ${st.queue.length}`); }
  flushing = false;
}
function buildProgram(rows){
  const p = {};
  rows.sort((a,b)=>a.order-b.order).forEach(r=>{
    ((p[r.user] ??= {})[r.day] ??= []).push({ex:r.exercise, sch:[1,2,3,4,5,6,7,8].map(i=>r["w"+i])});
  });
  return p;
}
const prog = () => (st.program || DRAFT);

/* ============ ЛОГИКА ============ */
const today = () => new Date().toISOString().slice(0,10);
const P = u => st.pos[u];
const wid = u => `C${P(u).cycle}|${u}|${P(u).week}|${P(u).day}`;     // ключ тренировки
const sid = (u,ex,n) => wid(u) + "|" + ex + "|" + n;
// Тренировка считается выполненной, когда нажато «Завершить тренировку»: в «Log» пишется служебная
// отметка с id "F|C3|Max|5|4" (она же синхронизирует номер тренировки между устройствами)
const isFin = l => String(l.id).startsWith("F|");
const setsOf = () => st.logs.filter(l => !isFin(l));            // только подходы
const finId = u => "F|" + wid(u);
const dk = l => String(l.date).slice(0,10);
function finList(u){
  return st.logs.filter(l => isFin(l) && l.user===u)
    .sort((a,b) => dk(a)<dk(b) ? -1 : dk(a)>dk(b) ? 1 : String(a.id)<String(b.id) ? -1 : 1);
}
function workoutNo(u){
  const f = finList(u), i = f.findIndex(l => l.id===finId(u));
  return { done: BASE[u] + f.length, cur: i>=0 ? BASE[u]+i+1 : BASE[u]+f.length+1, isDone: i>=0 };
}
// следующая позиция после завершённой: день+1 → неделя+1 → круг+1
function nextPos(p){
  if(p.day<4) return {cycle:p.cycle, week:p.week, day:p.day+1};
  if(p.week<8) return {cycle:p.cycle, week:p.week+1, day:1};
  return {cycle:p.cycle+1, week:1, day:1};
}
const parseFin = id => { const m = /^F\|C(\d+)\|[^|]+\|(\d+)\|(\d+)$/.exec(String(id)); return m ? {cycle:+m[1], week:+m[2], day:+m[3]} : null; };
// если тренировку завершили на другом устройстве — подтягиваем позицию вперёд
function followFinished(){
  USERS.forEach(u => {
    const f = finList(u); if(!f.length) return;
    const last = f.reduce((a,b) => { const pa=parseFin(a.id), pb=parseFin(b.id); if(!pb) return a; if(!pa) return b;
      return (pb.cycle*1000+pb.week*10+pb.day) > (pa.cycle*1000+pa.week*10+pa.day) ? b : a; });
    if(st.seen[u] === last.id) return;
    const p = parseFin(last.id); if(p) st.pos[u] = nextPos(p);
    st.seen[u] = last.id;
  });
  LS.set("pos", st.pos); LS.set("seenFin", st.seen);
}
const find = id => st.logs.find(l => l.id === id);
const key = l => l.week*10 + l.day;

const lowReps = reps => parseInt(String(reps),10) || 0;       // "8-10" -> 8
const hasR = l => l.reps!=="" && l.reps!=null;
const better = (a,b) => !b || a.weight>b.weight || (a.weight===b.weight && (hasR(a)?a.reps:0)>(hasR(b)?b.reps:0));
const fmt = s => s ? (hasR(s) ? `${s.weight}×${s.reps}` : `${s.weight}`) : "—";
const isHist = l => l.note==="импорт";

// Лучший результат за всё время при повторах не меньше нижней границы схемы
function recordOf(user, ex, reps){
  const lo = lowReps(reps); let best = null;
  setsOf().forEach(l => { if(l.user===user && l.exercise===ex && (!hasR(l) || l.reps>=lo) && better(l,best)) best = l; });
  return best;
}
// Лучший подход среди последних 3 предыдущих тренировок по этому упражнению (по дате, без текущей ячейки неделя/день)
const RECENT = 3;
function lastOf(user, ex){
  const cur = wid(user) + "|";
  const prev = setsOf().filter(l => l.user===user && l.exercise===ex && !String(l.id).startsWith(cur));
  if(!prev.length) return null;
  const dates = [...new Set(prev.map(dk))].sort().reverse().slice(0, RECENT);
  let best = null;
  prev.filter(l => dates.includes(dk(l))).forEach(l => { if(better(l,best)) best = l; });
  return best ? Object.assign({}, best, {k: best.week*10+best.day}) : null;
}
function statsHTML(user, ex, reps){
  const r = recordOf(user,ex,reps), l = lastOf(user,ex);
  return `<span>🏆 рекорд: <b>${fmt(r)}</b></span><span>⏪ пред.: <b>${fmt(l)}</b>${l?` <span class="mut">(н${Math.floor(l.k/10)}д${l.k%10})</span>`:""}</span>`;
}
const cid = (u,ex) => "st_"+btoa(unescape(encodeURIComponent(u+ex))).replace(/[^A-Za-z0-9]/g,"");

/* ---- запись подхода по галочке ✓ ---- */
const q1 = (sel) => document.querySelector(sel);
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; };   // "12,5" и "12.5" → 12.5
const inputsOf = id => ({
  w: q1(`input[data-f="w"][data-id="${CSS.escape(id)}"]`),
  r: q1(`input[data-f="r"][data-id="${CSS.escape(id)}"]`),
  b: q1(`button.ok[data-id="${CSS.escape(id)}"]`)
});
const inQueue = id => st.queue.some(q => (q.op==="save" && q.row.id===id) || (q.op==="del" && q.id===id));
// Кнопка подхода: пусто / ждёт нажатия / в очереди (нет связи) / сохранено / удалить
function refreshBtn(id){
  const {w, r, b} = inputsOf(id); if(!b) return;
  const saved = find(id), wv = w.value.trim(), rv = r.value.trim(), wn = num(wv), rn = num(rv);
  let cls = "ok off", txt = "✓", dis = true;
  if(wv==="" && rv===""){ if(saved){ cls = "ok del"; txt = "✕"; dis = false; } }
  else if(wn!==null && rn!==null){
    const same = saved && +saved.weight===wn && +saved.reps===rn;
    if(same){ cls = inQueue(id) ? "ok q" : "ok sv"; txt = inQueue(id) ? "⏳" : "✓"; dis = false; }
    else { cls = "ok dirty"; dis = false; }
  }
  b.className = cls; b.textContent = txt; b.disabled = dis;
  const done = !!saved && cls.includes("sv");
  w.classList.toggle("done", done); r.classList.toggle("done", done);
}
const refreshAll = () => document.querySelectorAll("button.ok").forEach(b => refreshBtn(b.dataset.id));
function refreshHead(u, ex, reps){
  const el = document.getElementById(cid(u,ex)); if(el) el.innerHTML = statsHTML(u,ex,reps);
  const wh = document.getElementById("wn_"+u); if(wh) wh.innerHTML = wnHTML(u);
}
async function commitSet(b){
  const {u, ex, n, id, reps} = b.dataset, {w, r} = inputsOf(id);
  const wn = num(w.value), rn = num(r.value);
  if(w.value.trim()==="" && r.value.trim()===""){
    if(!find(id)) return;
    st.logs = st.logs.filter(l => l.id!==id);
    st.queue = st.queue.filter(q => !(q.op==="save" && q.row.id===id)).concat({op:"del", id});
  } else if(wn!==null && rn!==null){
    const row = {id, date:today(), user:u, week:P(u).week, day:P(u).day, exercise:ex, set:+n, weight:wn, reps:rn, note:""};
    st.logs = st.logs.filter(l => l.id!==id).concat(row);
    st.queue = st.queue.filter(q => !(q.op==="save" && q.row.id===id)).concat({op:"save", row});
  } else return;
  LS.set("logs_cache", st.logs); LS.set("queue", st.queue);
  refreshBtn(id); refreshHead(u, ex, reps);
  setStatus("отправка…");
  await flush();                     // сразу уходит в таблицу, без буфера
  refreshAll();
}
/* ---- завершение тренировки ---- */
async function finishWorkout(u){
  const pre = wid(u) + "|";
  if(!setsOf().some(l => l.user===u && String(l.id).startsWith(pre))){
    alert("Сначала запишите хотя бы один подход (галочка ✓)."); return; }
  if(inQueue(finId(u))) return;
  const p = P(u);
  const row = {id:finId(u), date:today(), user:u, week:p.week, day:p.day, exercise:"✔ тренировка завершена", set:0, weight:0, reps:"", note:"тренировка"};
  st.logs = st.logs.filter(l => l.id!==row.id).concat(row);
  st.queue = st.queue.filter(q => !(q.op==="save" && q.row.id===row.id)).concat({op:"save", row});
  st.seen[u] = row.id; st.pos[u] = nextPos(p);
  LS.set("logs_cache", st.logs); LS.set("queue", st.queue); LS.set("pos", st.pos); LS.set("seenFin", st.seen);
  render(); setStatus("завершаю тренировку…");
  await flush(); await pull();       // отправили → обновили данные у всех
}
async function undoFinish(u){
  const id = finId(u); if(!find(id)) return;
  st.logs = st.logs.filter(l => l.id!==id);
  st.queue = st.queue.filter(q => !(q.op==="save" && q.row.id===id)).concat({op:"del", id});
  LS.set("logs_cache", st.logs); LS.set("queue", st.queue);
  render(); await flush();
}

/* ============ ОТРИСОВКА ============ */
function render(){
  $("#vw").classList.toggle("on", st.view==="prog");
  $("#main").innerHTML = st.view==="train" ? trainView() : progressView();
}
function wnHTML(u){
  const n = workoutNo(u);
  return `тренировка №${n.cur} ${n.isDone ? "✓ завершена" : "· идёт"} · завершено ${n.done}`;
}
function posBar(u){
  const p = P(u);
  const opt = (cnt, sel, lab) => Array.from({length:cnt}, (_,i) => `<option value="${i+1}" ${i+1===sel?"selected":""}>${lab} ${i+1}</option>`).join("");
  return `<div class="pos">
    <select data-pos="cycle" data-u="${u}">${opt(Math.max(6,p.cycle+1), p.cycle, "Круг")}</select>
    <select data-pos="week" data-u="${u}">${opt(8, p.week, "Нед")}</select>
    <select data-pos="day" data-u="${u}">${opt(4, p.day, "День")}</select></div>`;
}
function userCol(u){
  const list = (prog()[u]||{})[P(u).day] || [];
  const cards = list.length ? list.map(e=>{
    const c = parseScheme(e.sch[P(u).week-1] || e.sch[e.sch.length-1]);
    let sets = "";
    for(let n=1;n<=c.sets;n++){
      const id = sid(u,e.ex,n), l = find(id);
      const at = `data-id="${esc(id)}" data-u="${u}" data-ex="${esc(e.ex)}" data-n="${n}" data-reps="${esc(c.reps)}"`;
      const bc = !l ? "ok off" : inQueue(id) ? "ok q" : "ok sv";
      sets += `<div class="set"><span>${n}</span>
        <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="кг" data-f="w" ${at} class="${l?"done":""}" value="${l?l.weight:""}">
        <input type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="${esc(c.reps)}" data-f="r" ${at} class="${l?"done":""}" value="${l?l.reps:""}">
        <button class="${bc}" ${at} ${l?"":"disabled"}>${inQueue(id)?"⏳":"✓"}</button></div>`;
    }
    return `<div class="card"><div class="nm">${esc(e.ex)}</div><div class="sc">${c.sets}×${esc(c.reps)}</div>
      <div class="st" id="${cid(u,e.ex)}">${statsHTML(u,e.ex,c.reps)}</div>${sets}</div>`;
  }).join("") : `<div class="card mut">Нет упражнений</div>`;
  const fin = workoutNo(u).isDone
    ? `<div class="finok">✓ Тренировка завершена</div><button class="fin2" data-unfin="${u}">↩ Вернуть в работу</button>`
    : `<button class="fin" data-fin="${u}">✔ Завершить тренировку</button>`;
  return `<div class="${u.toLowerCase()}"><div class="colh">${u}<div class="wn" id="wn_${u}">${wnHTML(u)}</div></div>${posBar(u)}${cards}${fin}</div>`;
}
const trainView = () => `<div class="cols">${USERS.map(userCol).join("")}</div>`;

function progressView(){
  const sw = USERS.map(u=>`<button class="chip ${u===st.puser?"on":""}" data-pu="${u}">${u}</button>`).join(" ");
  const mine = setsOf().filter(l=>l.user===st.puser && !isHist(l));
  const exs = [...new Set(mine.map(l=>l.exercise))];
  if(!exs.length) return `<div class="row" style="margin-bottom:10px">${sw}</div><div class="pc mut">Пока нет записей.</div>`;
  const sel = st.pex && exs.includes(st.pex) ? st.pex : exs[0];
  const byWeek = {};
  mine.filter(l=>l.exercise===sel).forEach(l=>{ byWeek[l.week] = Math.max(byWeek[l.week]||0, +l.weight); });
  const pts = Object.entries(byWeek).map(([w,v])=>[+w,v]).sort((a,b)=>a[0]-b[0]);
  const max = Math.max(...pts.map(p=>p[1])), min = Math.min(...pts.map(p=>p[1]));
  const X = w => 20 + (w-1)/7*260, Y = v => max===min ? 60 : 100 - (v-min)/(max-min)*80;
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(p[0])},${Y(p[1])}`).join(" ");
  const col = st.puser==="Max" ? "var(--max)" : "var(--shirin)";
  const dots = pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${col}"/><text x="${X(p[0])}" y="${Y(p[1])-8}" font-size="10" text-anchor="middle" fill="currentColor">${p[1]}</text>`).join("");
  const opts = exs.map(e=>`<option ${e===sel?"selected":""}>${esc(e)}</option>`).join("");
  const vol = mine.reduce((s,l)=>s+l.weight*(+l.reps||0),0);
  return `<div class="row" style="margin-bottom:10px">${sw}</div>
    <div class="pc"><select id="pex">${opts}</select><div class="mut" style="margin:8px 0">Макс. вес по неделям</div>
    <svg viewBox="0 0 300 120"><path d="${path}" fill="none" stroke="${col}" stroke-width="2"/>${dots}</svg></div>
    <div class="pc mut">Подходов: <b>${mine.length}</b> · Тоннаж: <b>${Math.round(vol)} кг</b></div>`;
}

/* ============ СОБЫТИЯ ============ */
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.classList.contains("ok")){ commitSet(t); return; }
  if(t.dataset.fin){ finishWorkout(t.dataset.fin); return; }
  if(t.dataset.unfin){ undoFinish(t.dataset.unfin); return; }
  if(t.dataset.v){ st.view = st.view==="train" ? "prog" : "train"; }
  else if(t.dataset.pu){ st.puser=t.dataset.pu; LS.set("puser",st.puser); }
  else if(t.id==="cfg"){
    const u = prompt("URL веб-приложения Google Apps Script:", st.api);
    if(u!==null){ st.api=u.trim(); LS.set("api",st.api); pull().then(flush); }
    return;
  } else return;
  render();
});
document.addEventListener("change", e=>{
  if(e.target.id==="pex"){ st.pex=e.target.value; render(); }
  else if(e.target.dataset && e.target.dataset.pos){
    const d = e.target.dataset; st.pos[d.u][d.pos] = +e.target.value; LS.set("pos", st.pos); render();
  }
});
// пока вводите значения — только обновляем состояние галочки, ничего не отправляем
document.addEventListener("input", e=>{
  const d = e.target.dataset; if(d && d.f) refreshBtn(d.id);
});
document.addEventListener("focusin", e=>{ const d=e.target.dataset; if(d && d.f && e.target.value!=="") setTimeout(()=>{ try{ e.target.select(); }catch{} }, 0); });
window.addEventListener("online", ()=>flush().then(pull));
// вернулись в приложение (развернули телефон) — сразу дослать очередь и подтянуть свежие данные
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") flush().then(pull); });

followFinished();
render(); flush().then(pull);       // сначала мгновенно рисуем из кэша, потом тихо обновляем
</script>
</body>
</html>
